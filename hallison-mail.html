:root{--bg:#F1F3F5;--card:#fff;--text:#0f1520;--mut:#5b6572;--line:#e1e5ea;--blue:#1684D8;--gold:#D9A441;--ink:#080A0F}

.nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#cfd6df;padding:11px;border-radius:10px;font:inherit;cursor:pointer;margin-bottom:4px}.nav button.on{background:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}h1{font-size:22px;margin:0 0 14px}h2{font-size:17px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}input[type=color]{height:44px;padding:3px}textarea{min-height:140px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer;margin:4px 6px 4px 0}.alt{background:transparent;color:var(--text);border:1px solid var(--line)}.gold{background:var(--gold);color:#080A0F}.red{background:#c0392b}.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.hero{display:flex;gap:14px;align-items:center}.hero img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}small{color:var(--mut)}.msg{padding:10px 12px;border-radius:10px;margin:10px 0}.ok{background:#14532d;color:#d1fae5}.err{background:#7f1d1d;color:#fee2e2}.note{background:var(--bg);color:var(--mut);font-size:13px}
iframe{width:100%;height:460px;border:1px solid var(--line);border-radius:10px;background:#fff}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}.modal .card{max-width:420px;width:100%}
@media(max-width:760px){.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:5;border-right:0;border-top:3px solid var(--gold);padding:4px}.nav{display:flex}.nav button{flex-direction:column;font-size:11px;gap:2px;padding:6px 2px;justify-content:center;margin:0}.brand{display:none}.main{padding:14px 14px 90px}}
</style></head><body><div class="app"><aside class="side"><div class="brand hero" style="margin-bottom:14px"><img id="sp" alt=""><b style="font-size:14px" id="sn"></b></div><nav class="nav" id="nav" aria-label="Main"></nav></aside><main class="main" id="main"></main></div><div id="modal"></div>

async function doSend(){
 if(busy)return;const cfg={pk:S.pk,s:S.service,t:S.template};
 const rec={id:uid(),to:F.to.trim(),subject:F.subject,tpl:(allT().find(x=>x.id===F.tpl)||{}).name,time:Date.now()};
 const fail=m=>{status={t:'err',m};draw()};
 if(!cfg.pk||!cfg.s||!cfg.t)return fail('EmailJS is not configured. Open Settings > EmailJS Connection.');
 if(typeof emailjs==='undefined')return fail('EmailJS library did not load. Check your internet connection and reload.');
 if(!navigator.onLine)return fail('You are offline. Sending needs internet.');
 const w=30000-(Date.now()-lastSend);if(w>0)return fail(`Please wait ${Math.ceil(w/1000)}s before sending another email.`);
 busy=true;status=null;draw();
 try{const r=await emailjs.send(cfg.s,cfg.t,{to_email:F.to.trim(),to_name:F.rn,subject:mg(F.subject,F),from_name:S.name,reply_to:S.email,html_body:render(F,F.tpl,false),text_body:plain(F)},{publicKey:cfg.pk});
  lastSend=Date.now();sent=[{...rec,ok:true,result:`EmailJS accepted the request (${r.status} ${r.text})`},...sent];status={t:'ok',m:'EmailJS accepted the request. This does not confirm delivery to the recipient’s inbox.'}}
 catch(er){const st=er&&er.status;const m=st===429?'EmailJS rate limit reached. Try again later.':(!st?'Network error. The email may not have been sent; check your EmailJS dashboard before retrying.':`EmailJS rejected the request (${st}): ${er.text||'unknown error'}`);
  sent=[{...rec,ok:false,result:m},...sent];status={t:'err',m}}
 busy=false;sv('sent',sent);draw()}
draw();
